# mcp-threatintel v2 on the protected Ubuntu server.
#
# Two unprivileged containers (non-root UID 1000, one image):
#   mcp-threatintel     MCP server on :3707, reachable from the analyst PC only
#                       (nftables table inet threatintel, deploy/threatintel.nft)
#   threatintel-poller  hourly sync of abuse.ch / OTX / CISA KEV into the cache
#
# The privileged host agent is NOT a container: it runs as the systemd service
# threatintel-responder and is the only component that changes the host.
# The MCP container reaches it through /run/threatintel/agent.sock (group
# threatintel, given to the container with group_add). The admin socket lives
# in /run/threatintel-admin, which is never mounted here.
#
# Install everything with: sudo bash scripts/ubuntu/setup-ubuntu.sh

services:
  mcp-threatintel:
    build: .
    image: mcp-threatintel:v2
    container_name: mcp-threatintel
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=3707
      - DB_PATH=/data/threatintel.db
      - AGENT_ADDR=unix:///run/threatintel/agent.sock
      - TZ=${TZ:-UTC}
    volumes:
      - ${THREATINTEL_DATA:-/var/lib/threatintel/data}:/data
      - /run/threatintel:/run/threatintel
    group_add:
      - "${THREATINTEL_GID:?THREATINTEL_GID missing from .env, run scripts/ubuntu/setup-ubuntu.sh}"

  threatintel-poller:
    image: mcp-threatintel:v2
    container_name: threatintel-poller
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - DB_PATH=/data/threatintel.db
      - LOCAL_IOCS_FILE=/app/lab/local_iocs.csv
      - TZ=${TZ:-UTC}
    volumes:
      - ${THREATINTEL_DATA:-/var/lib/threatintel/data}:/data
      - ./lab:/app/lab:ro
    entrypoint: ["mcp-threatintel-poller", "--loop", "--interval", "3600"]
    depends_on:
      - mcp-threatintel
